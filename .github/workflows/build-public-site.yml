name: Build public site

on:
  push:
    branches: [main]
    paths:
      - "content/**"
      - "templates/**"
      - "build.py"
      - ".github/workflows/build-public-site.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the public repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generate public HTML
        run: python build.py --all --output .

      - name: Commit generated pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html' '**/*.html'
          if git diff --cached --quiet; then
            echo "No generated page changes"
          else
            git commit -m "build: regenerate public pages [skip ci]"
            git push
          fi
